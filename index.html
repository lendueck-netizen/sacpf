const W={2:1,3:2,4:3,5:4,6:5,7:6,8:5,9:4,10:3,11:2,12:1},OP=['QB','HB','FB','WB','SE','FL','TE'];
const val=s=>{s=String(s);if(s.includes('TD'))return 50;const m=s.match(/-?\d+/);return m?+m[0]:0};
const av=f=>{let t=0;for(let r=2;r<=12;r++)t+=W[r]*f(r);return t/36};
const roster=t=>{const a=[],rc=c=>['S','M','L'].map((l,i)=>c.rec[2][i]===''?'–':av(r=>val(c.rec[r][i])).toFixed(1)).join(' / ');

function hurtOK(i,p,pos){const e=G.inj[i][p.n];if(!e||!['play','quarter','half'].includes(e.scope))return false;
